<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>"码"上服务平台</title>
<style id="theme-vars">

  --lm-background:#f8fafc;--lm-foreground:#1e293b;--lm-card:#ffffff;--lm-card-foreground:#1e293b;--lm-popover:#ffffff;--lm-popover-foreground:#1e293b;--lm-primary:#2563eb;--lm-primary-foreground:#ffffff;--lm-muted:#f1f5f9;--lm-muted-foreground:#64748b;--lm-border:#e2e8f0;--lm-input:#e2e8f0;--lm-ring:#3b82f6;
  --lm-state-success:#10b981;--lm-state-success-bg:#ecfdf5;--lm-state-warning:#f59e0b;--lm-state-warning-bg:#fffbeb;--lm-state-error:#ef4444;--lm-state-error-bg:#fef2f2;--lm-state-info:#3b82f6;--lm-state-info-bg:#eff6ff;
  --lm-radius-sm:4px;--lm-radius-md:8px;--lm-radius-lg:12px;--lm-radius-xl:16px;--lm-radius-full:9999px;
  --lm-shadow-1:0 1px 2px rgba(15,23,42,0.05),0 1px 1px rgba(15,23,42,0.03);--lm-shadow-2:0 4px 12px -4px rgba(15,23,42,0.1);--lm-shadow-3:0 16px 40px -12px rgba(15,23,42,0.18);
  --lm-space-1:4px;--lm-space-2:8px;--lm-space-3:12px;--lm-space-4:16px;--lm-space-5:20px;--lm-space-6:24px;--lm-space-7:32px;--lm-space-8:40px;
  --lm-font-sans:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --lm-font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --lm-text-xs:12px;--lm-text-sm:13px;--lm-text-base:15px;--lm-text-lg:17px;--lm-text-xl:20px;--lm-text-2xl:24px;--lm-text-3xl:30px;
}
.dark{--lm-background:#0f172a;--lm-foreground:#f8fafc;--lm-card:#1e293b;--lm-card-foreground:#f8fafc;--lm-popover:#1e293b;--lm-popover-foreground:#f8fafc;--lm-primary:#60a5fa;--lm-primary-foreground:#0f172a;--lm-muted:#334155;--lm-muted-foreground:#94a3b8;--lm-border:#334155;--lm-input:#334155;--lm-ring:#60a5fa;}
:root{--color-background:var(--lm-background);--color-foreground:var(--lm-foreground);--color-card:var(--lm-card);--color-card-foreground:var(--lm-card-foreground);--color-popover:var(--lm-popover);--color-popover-foreground:var(--lm-popover-foreground);--color-primary:var(--lm-primary);--color-primary-foreground:var(--lm-primary-foreground);--color-muted:var(--lm-muted);--color-muted-foreground:var(--lm-muted-foreground);--color-border:var(--lm-border);--color-input:var(--lm-input);--color-ring:var(--lm-ring);--radius-sm:var(--lm-radius-sm);--radius-md:var(--lm-radius-md);--radius-lg:var(--lm-radius-lg);--radius-xl:var(--lm-radius-xl);--radius-full:var(--lm-radius-full);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
@theme inline {
  --color-background:var(--lm-background);--color-foreground:var(--lm-foreground);--color-card:var(--lm-card);--color-card-foreground:var(--lm-card-foreground);--color-popover:var(--lm-popover);--color-popover-foreground:var(--lm-popover-foreground);--color-primary:var(--lm-primary);--color-primary-foreground:var(--lm-primary-foreground);--color-muted:var(--lm-muted);--color-muted-foreground:var(--lm-muted-foreground);--color-border:var(--lm-border);--color-input:var(--lm-input);--color-ring:var(--lm-ring);--radius-sm:var(--lm-radius-sm);--radius-md:var(--lm-radius-md);--radius-lg:var(--lm-radius-lg);--radius-xl:var(--lm-radius-xl);
}
@layer base { body{font-family:var(--lm-font-sans);-webkit-font-smoothing:antialiased;} }
</style>
<style>
.no-scrollbar::-webkit-scrollbar{display:none;}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
.safe-area-pb{padding-bottom:max(12px,env(safe-area-inset-bottom));}
/* 渐变背景 */
.entry-bg{
  background:linear-gradient(160deg,#e0e7ff 0%,#eef2ff 25%,#f0f9ff 55%,#ffffff 100%);
  min-height:100vh;
  min-height:100dvh;
}
/* 卡片悬浮动画 */
.entry-card{
  animation:cardFadeIn 0.6s ease-out;
}
@keyframes cardFadeIn{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
/* 按钮点击反馈 */
.entry-btn{transition:transform 0.15s ease, box-shadow 0.15s ease;}
.entry-btn:active{transform:scale(0.97);}
</style>
</head>
<body class="entry-bg flex items-center justify-center">

  <div class="w-full max-w-md mx-auto px-6 py-8">
    <!-- 白色卡片 -->
    <div class="entry-card bg-white rounded-3xl shadow-[0_8px_40px_-8px_rgba(37,99,235,0.15)] px-8 py-12 flex flex-col items-center text-center">

      <!-- 标题 -->
      <h1 class="text-2xl font-bold text-gray-900 tracking-tight">"码"上服务平台</h1>

      <!-- 副标题 -->
      <p class="text-sm text-gray-400 mt-3 tracking-wide">连接终端 · 服务客户 · 赋能经营 · 监管市场</p>

      <!-- 分隔线 -->
      <div class="w-12 h-0.5 bg-blue-100 rounded-full mt-6 mb-8"></div>

      <!-- 零售户端入口 -->
      <a href="./basic-services.html" class="entry-btn block w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-base shadow-lg shadow-blue-500/25 mb-4">
        零售户端入口
      </a>

      <!-- 消费者端入口 -->
      <a href="./public-info.html" class="entry-btn block w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-base shadow-lg shadow-emerald-500/25">
        消费者端入口
      </a>

      <!-- 底部说明 -->
      <p class="text-xs text-gray-400 mt-8 leading-relaxed">
        通过"客户服务码+消费者监督码"<br>打通商零消的信息链路
      </p>

    </div>

    <!-- 底部署名 -->
    <p class="text-center text-xs text-gray-400 mt-6">玉溪市局（公司） · 卷烟营销数字化转型</p>
  </div>

  <script>if(window.lucide) lucide.createIcons();</script>
</body>
</html>
